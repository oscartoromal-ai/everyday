# Non-secret app configuration. Machine-specific secrets live in local/ (git-ignored).

[server]
host = "127.0.0.1"
port = 8377

[install]
# The modules this machine leaves out, of "health", "finances" and "code"
# (Planner and Projects are always in). The installer writes it to
# install.toml in the app's home, from the modules left unticked.
without = []

[storage]
db_path = "data/personal-calendar.db"

[work_calendar]
# Path to the git-ignored file holding the published ICS feed URL.
ics_url_file = "local/work-calendar-ics-url.txt"
# Poll times, local wall clock, morning-weighted.
poll_times = ["06:30", "12:30", "16:30"]

[push]
# Managed ntfy.sh; the unguessable topic and access token live in local/.
ntfy_server = "https://ntfy.sh"
ntfy_topic_file = "local/ntfy-topic.txt"
ntfy_token_file = "local/ntfy-token.txt"
digest_time = "07:45"

[backup]
# Point this at a cloud-synced folder; actual path TBD by Oscar.
dir = "backups"
retain = 30

[nutrition]
# The Markdown files nutrition lives in (plan.md, meals/, log/), written by
# Claude from Nutrition's chat.
dir = "nutrition"

[garmin]
# Garmin Connect, connected from Health > Garmin. Its sign-in token lives in
# token_dir (git-ignored); the password is used once and never kept.
token_dir = "local/garmin"
sync_minutes = 30
backfill_days = 30

[improve]
# The daily scan for what to improve in the app (improve/ in the repo), run
# by the installed app from a checkout of origin's master after this time, or
# when it is next up and awake. Its report, ledger and brief go to improve/
# beside the app's database (data/improve/). project names the project the
# app's work is planned on, when no project lists the repo.
enabled = true
after = "02:30"
project = ""

[github]
# GitHub, connected from Repositories: through the GitHub CLI's own sign-in
# (the app keeps no copy), or a token pasted there, kept in tokens_dir, a
# file per account (git-ignored). cli is gh's path; empty finds it.
tokens_dir = "local/github-tokens"
cli = ""
sync_minutes = 60
