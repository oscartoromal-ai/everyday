{% set p = card.project %}
<article class="project-card editing" id="project-{{ p.id }}">
  <form class="project-editor"
        hx-post="/ui/projects/{{ p.id }}" hx-target="#project-{{ p.id }}" hx-swap="outerHTML">
    <label class="field">
      <span class="field-label">Project</span>
      <span class="field-line"><input name="name" value="{{ p.name }}" required autofocus></span>
    </label>
    {# Its colour: the flag on its tasks, and their rules. #}
    <fieldset class="field color-field">
      <legend class="field-label">Colour</legend>
      <span class="swatches">
        {% for n in range(1, 9) %}
        <label class="swatch" style="--project: var(--hue-{{ n }})">
          <input type="radio" name="color" value="{{ n }}"{% if p.color == n %} checked{% endif %} aria-label="Colour {{ n }}">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 17.5V3.5"/><path d="M5 4h9.5l-2.2 3.25L14.5 10.5H5"/></svg>
        </label>
        {% endfor %}
      </span>
    </fieldset>
    <label class="field">
      <span class="field-label">Notes</span>
      <span class="field-line"><textarea name="notes" rows="3">{{ p.notes }}</textarea></span>
    </label>
    <div class="editor-actions">
      <button type="submit" class="btn primary">Save</button>
      <button type="button" class="btn quiet"
              hx-get="/ui/projects/{{ p.id }}/card" hx-target="#project-{{ p.id }}" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</article>
