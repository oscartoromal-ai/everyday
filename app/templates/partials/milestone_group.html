<div class="milestone-group" data-file-milestone="{{ group.m.milestone.id }}">
  <ul class="milestones">
    {% with m = group.m %}{% include "partials/milestone_row.html" %}{% endwith %}
  </ul>
  {% if group.rows %}
  <ul class="task-list milestone-tasks">
    {% for row in group.rows %}{% include "partials/task_row.html" %}{% endfor %}
  </ul>
  {% endif %}
</div>
