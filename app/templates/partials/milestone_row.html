<li class="milestone{% if m.milestone.status.value == 'reached' %} reached{% endif %}" id="milestone-{{ m.milestone.id }}">
  <button type="button" aria-label="Mark “{{ m.milestone.name }}” {% if m.milestone.status.value == 'reached' %}open{% else %}reached{% endif %}"
          hx-post="/ui/milestones/{{ m.milestone.id }}/toggle"
          hx-target="#milestone-{{ m.milestone.id }}" hx-swap="outerHTML">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      {% if m.milestone.status.value == 'reached' %}
      <circle cx="10" cy="10" r="7"/><path d="M6.8 10.2l2.2 2.2 4.2-5"/>
      {% else %}
      <circle cx="10" cy="10" r="7"/>
      {% endif %}
    </svg>
  </button>
  <span class="name">{{ m.milestone.name }}</span>
  {% if m.target_label %}<span class="target{% if m.target_soon %} soon{% endif %}">{{ m.target_label }}</span>{% endif %}
  {% if m.progress[1] > 0 %}<span class="progress">{{ m.progress[0] }}/{{ m.progress[1] }}</span>{% endif %}
</li>
