<li id="task-{{ task.id }}">
  <form class="task-editor"
        hx-post="/ui/tasks/{{ task.id }}"
        hx-target="#task-{{ task.id }}" hx-swap="outerHTML">
    <div class="editor-title">
      <input name="title" value="{{ task.title }}" required aria-label="Task title" autofocus>
    </div>
    <div class="grid">
      <div class="field">
        <label for="status-{{ task.id }}">Status</label>
        <select id="status-{{ task.id }}" name="status">
          {% for s in ["todo", "in_progress", "blocked", "needs_review", "done", "cancelled"] %}
          <option value="{{ s }}" {% if task.status.value == s %}selected{% endif %}>{{ s.replace("_", " ") }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="owner-{{ task.id }}">Owner</label>
        <select id="owner-{{ task.id }}" name="owner">
          <option value="oscar" {% if task.owner.value == "oscar" %}selected{% endif %}>Oscar</option>
          <option value="claude" {% if task.owner.value == "claude" %}selected{% endif %}>Claude</option>
        </select>
      </div>
      <div class="field">
        <label for="planned-{{ task.id }}">Planned for</label>
        <input id="planned-{{ task.id }}" type="date" name="planned_for"
               value="{{ task.planned_for.isoformat() if task.planned_for else '' }}">
      </div>
      <div class="field">
        <label for="due-{{ task.id }}">Due</label>
        <input id="due-{{ task.id }}" type="date" name="due"
               value="{{ task.due.isoformat() if task.due else '' }}">
      </div>
      <div class="field">
        <label for="project-{{ task.id }}">Project</label>
        <select id="project-{{ task.id }}" name="project_id">
          <option value="">None</option>
          {% for p in projects %}
          <option value="{{ p.id }}" {% if task.project_id == p.id %}selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="milestone-{{ task.id }}">Milestone</label>
        <select id="milestone-{{ task.id }}" name="milestone_id">
          <option value="">None</option>
          {% for p in projects %}{% for m in p.milestones %}
          <option value="{{ m.id }}" {% if task.milestone_id == m.id %}selected{% endif %}>{{ p.name }} · {{ m.name }}</option>
          {% endfor %}{% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="repeat-{{ task.id }}">Repeat</label>
        <select id="repeat-{{ task.id }}" name="repeat">
          {% for value, label in [("none", "Does not repeat"), ("daily", "Daily"), ("weekdays", "Weekdays"), ("weekly", "Weekly"), ("monthly", "Monthly")] %}
          <option value="{{ value }}" {% if repeat == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label for="notes-{{ task.id }}">Notes</label>
        <textarea id="notes-{{ task.id }}" name="notes" rows="2">{{ task.notes }}</textarea>
      </div>
    </div>
    <div class="editor-actions">
      <button type="submit" class="btn primary">Save</button>
      <button type="button" class="btn quiet"
              hx-get="/ui/tasks/{{ task.id }}/row"
              hx-target="#task-{{ task.id }}" hx-swap="outerHTML">Cancel</button>
      <span class="spacer"></span>
      <button type="button" class="btn danger-quiet"
              hx-post="/ui/tasks/{{ task.id }}/delete"
              hx-confirm="Delete “{{ task.title }}”?"
              hx-target="#task-{{ task.id }}" hx-swap="outerHTML">Delete</button>
    </div>
  </form>
</li>
