{% extends "base.html" %}
{% block title %}Projects · Personal Calendar{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Projects</h1>
</header>

{% include "partials/projects_list.html" %}

<form class="inline-form new-project"
      hx-post="/ui/projects"
      hx-target="#projects" hx-swap="outerHTML"
      hx-on::after-request="if (event.detail.successful) this.reset()">
  <div class="field" style="flex: 2;">
    <input name="name" placeholder="Start a project…" aria-label="Project name" required>
  </div>
  <button type="submit" class="btn primary">Create</button>
</form>
{% endblock %}
