{# The Tasks tab's gear: its views, the one shown ticked; choosing one
   keeps it for every project's tab (tasks-views.js opens the menu from
   the template). #}
<div class="tasks-view-menu">
  <button type="button" class="tasks-view-open" aria-haspopup="menu" aria-expanded="false"
          aria-label="View: {{ view.label }}" title="View: {{ view.label }}. Choose how the tasks are shown">
    <span class="tasks-view-name">{{ view.label }}</span>
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M8.6 2.75h2.8l.45 2.1 1.5.86 2.04-.68 1.4 2.42-1.6 1.43v1.74l1.6 1.43-1.4 2.42-2.04-.68-1.5.86-.45 2.1H8.6l-.45-2.1-1.5-.86-2.04.68-1.4-2.42 1.6-1.43V9.13l-1.6-1.43 1.4-2.42 2.04.68 1.5-.86z"/></svg>
  </button>
  <template class="tasks-view-items">
    <div class="sheet-menu tasks-view-choices" role="menu" aria-label="View">
      {% for v in views %}
      <button type="button" role="menuitemradio" tabindex="-1" data-view="{{ v.key }}" aria-checked="{{ 'true' if v.key == view.key else 'false' }}">
        <span class="label"><span class="tasks-view-label">{{ v.label }}</span><span class="tasks-view-about">{{ v.about }}</span></span>
        {% if v.key == view.key %}<svg class="tick" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>{% endif %}
      </button>
      {% endfor %}
    </div>
  </template>
</div>
