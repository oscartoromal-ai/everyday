{# The Markdown's modes, as Obsidian's, at a page header's right: written
   and drawn as it reads, written as its Markdown, or only read (Ctrl+E).
   MarkdownLive.bindSwitch presses the one in use. #}
{% macro md_modes() %}
<div class="segmented md-modes" role="group" aria-label="View" data-md-modes>
  <button type="button" data-md-mode="live" aria-pressed="false" title="{{ keys.title('Write it, drawn as it reads', 'editor.live') }}">Live</button>
  <button type="button" data-md-mode="source" aria-pressed="false" title="{{ keys.title('Write its Markdown', 'editor.source') }}">Source</button>
  <button type="button" data-md-mode="reading" aria-pressed="false" title="{{ keys.title('Read it', 'editor.reading') }}">Reading</button>
</div>
{% endmacro %}
