[project]
name = "personal-calendar"
# The package's, for packaging alone: the app's version is its changelog's
# (changes/, app/changelog.py).
version = "0.1.0"
description = "Oscar's personal planner: calendar, todos, projects, and an MCP planner interface."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.5",
    "fastmcp>=3.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "httpx>=0.27",
    "claude-agent-sdk>=0.2.162",
    "pyyaml>=6.0.3",
    "markdown-it-py>=4.2.0",
    "garminconnect>=0.3.17",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "linkify-it-py>=2.2.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
personal-calendar = "app.serve:main"
personal-calendar-desktop = "app.desktop:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "playwright>=1.62.0",
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; keep the generator's style.
"migrations/versions/*" = ["E501", "W291", "I001", "UP", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
