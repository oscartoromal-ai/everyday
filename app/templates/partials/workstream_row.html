{% from "partials/workstream_check.html" import workstream_check %}
<li class="workstream{% if m.done %} done{% endif %}" id="workstream-{{ m.workstream.id }}">
  {{ workstream_check(m) }}
  <span class="name">{{ m.workstream.name }}</span>
  {% if m.progress[1] > 0 %}<span class="progress">{{ m.progress[0] }}/{{ m.progress[1] }}</span>{% endif %}
</li>
