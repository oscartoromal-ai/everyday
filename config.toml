# Non-secret app configuration. Machine-specific secrets live in local/ (git-ignored).

[server]
host = "127.0.0.1"
port = 8377

[storage]
db_path = "data/personal-calendar.db"

[work_calendar]
# Path to the git-ignored file holding the published ICS feed URL.
ics_url_file = "local/work-calendar-ics-url.txt"
# Poll times, local wall clock, morning-weighted.
poll_times = ["06:30", "12:30", "16:30"]

[push]
# Managed ntfy.sh; the unguessable topic and access token live in local/.
ntfy_server = "https://ntfy.sh"
ntfy_topic_file = "local/ntfy-topic.txt"
ntfy_token_file = "local/ntfy-token.txt"
digest_time = "07:45"

[backup]
# Point this at a cloud-synced folder; actual path TBD by Oscar.
dir = "backups"
retain = 30

[claude]
# The Claude Code executable the chats run (Nutrition, Spending); empty
# finds it (see app/config.py).
cli = ""

[nutrition]
# The Markdown files nutrition lives in (plan.md, meals/, log/), written by
# Claude from Nutrition's chat.
dir = "nutrition"
model = "claude-opus-5-5"

[money]
# The model behind Spending's chat, which keeps Finances with Oscar.
model = "claude-opus-5-5"

[garmin]
# Garmin Connect, connected from Health > Garmin. Its sign-in token lives in
# token_dir (git-ignored); the password is used once and never kept.
token_dir = "local/garmin"
sync_minutes = 30
backfill_days = 30

[github]
# GitHub, connected from Repositories: through the GitHub CLI's own sign-in
# (the app keeps no copy), or a token pasted there, kept in token_file
# (git-ignored). cli is gh's path; empty finds it.
token_file = "local/github-token.txt"
cli = ""
sync_minutes = 60
