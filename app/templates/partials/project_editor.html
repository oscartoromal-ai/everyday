{% set p = card.project %}
<article class="project-card editing" id="project-{{ p.id }}">
  <form class="project-editor"
        hx-post="/ui/projects/{{ p.id }}" hx-target="#project-{{ p.id }}" hx-swap="outerHTML">
    <label class="field">
      <span class="draft-label">Project</span>
      <span class="plate"><input name="name" value="{{ p.name }}" required autofocus></span>
    </label>
    <label class="field">
      <span class="draft-label">Notes</span>
      <span class="plate"><textarea name="notes" rows="3">{{ p.notes }}</textarea></span>
    </label>
    <div class="editor-actions">
      <button type="submit" class="btn primary">Save</button>
      <button type="button" class="btn quiet"
              hx-get="/ui/projects/{{ p.id }}/card" hx-target="#project-{{ p.id }}" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</article>
