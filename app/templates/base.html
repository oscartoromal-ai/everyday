<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Personal Calendar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script>
    // Double-submit CSRF: echo the cookie on every htmx request.
    window.csrfToken = () =>
      (document.cookie.split("; ").find((c) => c.startsWith("csrf=")) || "").slice(5);
    addEventListener("htmx:configRequest", (e) => {
      e.detail.headers["X-CSRF"] = window.csrfToken();
    });
  </script>
</head>
<body>
<!--
THESIS: a paper day-planner made digital; ruled lists and ink, refusing the dashboard-of-cards arrangement.
OWN-WORLD: warm paper ground, ink text, leather-green action ink, red urgency ink, copper for Claude's work; Source Serif 4 display over a system sans; hairline rules instead of boxes.
STORY: Oscar opens onto today, sees the day's shape at a glance, checks things off, replans what slipped, and reviews what Claude finished.
FIRST VIEWPORT: left rail of planner tabs; the day page leads with a serif weekday header, then today's ruled task list, then Delegated to Claude with stamped status chips, quick-add as the pen line at the foot.
FORM: user-pinned "calm paper planner" (no seed; direction chosen by Oscar 2026-08-28).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<div class="shell">
  <aside class="rail">
    <div class="wordmark">
      <a href="/">Personal Calendar</a>
      <span class="date">{{ today | human_date }}</span>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="/" {% if active == "today" %}aria-current="page"{% endif %}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M3 8h14"/><circle cx="10" cy="12.5" r="1.4" fill="currentColor" stroke="none"/></svg>
        Today
      </a>
      <a href="/next" {% if active == "next" %}aria-current="page"{% endif %}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h14"/><path d="M3 10h9"/><path d="M3 14.5h9"/><path d="M14.5 11.5l2.5 3-2.5 3"/></svg>
        Next days
      </a>
      <a href="/backlog" {% if active == "backlog" %}aria-current="page"{% endif %}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l2.2-5.2A1.5 1.5 0 0 1 6.6 5h6.8a1.5 1.5 0 0 1 1.4.8L17 11"/><path d="M3 11h4l1 2h4l1-2h4v3.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"/></svg>
        Backlog
      </a>
      <a href="/calendar" {% if active == "calendar" %}aria-current="page"{% endif %}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M7 2.5v3"/><path d="M13 2.5v3"/><path d="M3 8.5h14"/></svg>
        Calendar
      </a>
      <a href="/projects" {% if active == "projects" %}aria-current="page"{% endif %}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17.5V3.5"/><path d="M5 4h9.5l-2.2 3.25L14.5 10.5H5"/></svg>
        Projects
      </a>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
